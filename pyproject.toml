[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghedge"
version = "0.2.0"
description = "Monte Carlo pricing and dynamic hedging of variable annuity maturity guarantees with constant and Hull-White stochastic rates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]
notebook = ["jupyter", "nbconvert>=7", "nbformat>=5", "ipykernel>=6"]

[tool.setuptools]
packages = ["ghedge", "ghedge.rates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
